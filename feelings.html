<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dear Chatinon | Sweet Peas</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="site-header"></div>

<main>

<section class="bg-[#edeee4] py-24 lg:py-32 px-6 text-center">
  <p class="section-label">YOUR VOICE MATTERS</p>

  <h1 class="page-title text-6xl sm:text-8xl mt-7">
    Dear You.
  </h1>

  <p class="text-sm text-[#8b9581] mt-7">
    พื้นที่สำหรับส่งข้อความและความรู้สึกถึงชตินนท์
  </p>
</section>


<section class="max-w-4xl mx-auto px-6 py-20">

  <div class="text-center mb-12">
    <p class="serif italic text-3xl text-[#c99e8e]">
      A little message from you.
    </p>

    <p class="text-sm text-[#87917e] leading-8 mt-5">
      ทุกความรู้สึกมีความหมาย
      ขอบคุณที่อยากแบ่งปันเรื่องราวของคุณกับ Sweet Peas
    </p>
  </div>


  <!-- GOOGLE APPS SCRIPT EMBED -->
  <div class="bg-white border border-[#e8e8dd] p-3 sm:p-5">

    <div class="flex justify-between items-center px-3 py-4 border-b border-[#e8e8dd]">
      <span class="section-label">SEND YOUR MESSAGE</span>
      <span class="text-[#c99e8e]">♡</span>
    </div>

    <iframe
      src="YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"
      width="100%"
      height="750"
      frameborder="0"
      loading="lazy"
      title="Sweet Peas Feelings Form"
      style="border:0;display:block;background:#fff;">
    </iframe>

  </div>

  <p class="text-center text-xs text-[#a1a58e] mt-7 leading-7">
    Your words are always welcome here.<br>
    Thank you for being part of Sweet Peas.
  </p>

    <div class="text-center mt-12">
    <a href="index.html" class="text-sm text-[#52694d] border-b border-[#a1a58e] pb-2">
      ← Back to homepage
    </a>
  </div>

</section>

</main>

<div id="site-footer"></div>
<script src="common.js"></script>
</body>
</html>
